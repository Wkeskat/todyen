<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งชาไทย | Tod YEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<!-- LINE LIFF SDK (ฟรี) -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --blue:#0B4AA8; --blue-deep:#073580; --tea:#E2701F; --coral:#E05638;
  --sun:#FFD23F; --cta:#FF8200;
  --bg:#EEF3FB; --surface:#FFFFFF; --ink:#13213D; --muted:#5B6987; --line:#D7E0F0;
  --chip:#F4F7FD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06173A; --surface:#0E2551; --ink:#EEF3FF; --muted:#A6B5D6; --line:#24407A; --chip:#132E62;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06173A; --surface:#0E2551; --ink:#EEF3FF; --muted:#A6B5D6; --line:#24407A; --chip:#132E62;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Thai","Sarabun","Noto Sans Thai",Tahoma,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
.wrap{max-width:520px;margin:0 auto;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,.display{font-family:"Mitr","IBM Plex Sans Thai",Tahoma,sans-serif;font-weight:500;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- Hero ---------- */
.hero{background:var(--blue);color:#fff;padding:18px 20px 24px;position:relative;overflow:hidden}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:18px}
.brand b{font-family:"Mitr",sans-serif;font-weight:600;color:var(--coral);font-size:22px;letter-spacing:.01em}
.brand span{font-size:13px;color:#BFD1F2}
.hero-grid{display:grid;grid-template-columns:1fr 42%;gap:12px;align-items:center}
.hero h1{font-size:clamp(46px,14vw,72px);line-height:1;white-space:nowrap;color:var(--tea);font-weight:600;
  text-shadow:0 2px 0 var(--blue-deep)}
.hero .en{font-family:"Mitr",sans-serif;font-size:18px;color:#fff;margin:0 0 4px}
.tagline{margin:10px 0 0;font-size:15px;color:#DCE7FA}
.photo{position:relative}
.photo img{display:block;width:100%;height:auto;transform:scale(1.12);transform-origin:center 60%;
  filter:drop-shadow(0 14px 10px rgba(3,22,60,.45))}
.promo{margin-top:16px;display:inline-flex;align-items:center;gap:10px;background:var(--blue-deep);border-radius:999px;padding:6px 14px 6px 6px;font-size:14px}
.promo em{font-style:normal;background:var(--sun);color:var(--blue);font-family:"Mitr",sans-serif;font-weight:500;border-radius:999px;padding:2px 10px}
.promo s{color:#9FB3DA}

/* ---------- Sections ---------- */
section.card{background:var(--surface);margin:14px 12px 0;border-radius:18px;padding:18px 16px}
.card h2{font-size:19px;margin-bottom:4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}

/* sweetness */
.sweet{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sw{background:var(--chip);border:2px solid transparent;border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.sw svg{width:34px;height:44px;color:var(--muted)}
.sw .pct{font-family:"Mitr",sans-serif;font-size:15px;line-height:1}
.sw .lbl{font-size:11.5px;color:var(--muted);line-height:1.2;text-align:center}
.sw[aria-checked="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.sw[aria-checked="true"] svg{color:#fff}
.sw[aria-checked="true"] .lbl{color:#D6E2F7}
.sugar{fill:var(--tea);transition:y .25s ease,height .25s ease}

.add-row{display:flex;gap:10px;margin-top:16px;align-items:stretch}
.stepper{display:flex;align-items:center;background:var(--chip);border-radius:14px}
.stepper button{width:44px;height:48px;border:0;background:none;font-size:22px;color:var(--blue)}
:root[data-theme="dark"] .stepper button{color:#9EC0FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stepper button{color:#9EC0FF}}
.stepper output{min-width:26px;text-align:center;font-family:"Mitr",sans-serif;font-size:18px}
.btn-add{flex:1;border:0;border-radius:14px;background:var(--blue);color:#fff;font-family:"Mitr",sans-serif;font-size:16px}
.btn-add:active{transform:translateY(1px)}

/* cart */
.empty{color:var(--muted);font-size:15px;margin:0;padding:6px 0}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .mini{width:24px;height:31px;color:var(--muted);flex:none}
.line .name{flex:1;min-width:0}
.line .name b{font-weight:500;display:block}
.line .name span{font-size:13.5px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.qty output{min-width:24px;text-align:center;font-family:"Mitr",sans-serif}
.sum{margin-top:12px;border-top:2px dashed var(--line);padding-top:12px;font-size:15px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .disc{color:var(--coral)}
.sum .total{font-family:"Mitr",sans-serif;font-size:20px;color:var(--ink);padding-top:6px}
.sum .total span:last-child{color:var(--tea)}

textarea{width:100%;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 12px;font:inherit;font-size:15px;resize:vertical}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.bar-in{max-width:520px;margin:0 auto}
.upsell{font-size:13px;color:var(--blue);background:#FFF4C2;border-radius:10px;padding:5px 10px;margin-bottom:8px}
:root[data-theme="dark"] .upsell{background:#3A3410;color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .upsell{background:#3A3410;color:var(--sun)}}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-total{flex:1;line-height:1.2}
.bar-total small{display:block;color:var(--muted);font-size:13px}
.bar-total strong{font-family:"Mitr",sans-serif;font-size:24px;font-weight:500}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.12)}}
.btn-go{border:0;border-radius:999px;background:var(--cta);color:#fff;font-family:"Mitr",sans-serif;font-size:17px;padding:12px 22px;box-shadow:0 4px 0 #C85F00}
.btn-go:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(4,15,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:30}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h2{font-size:21px;margin-bottom:6px}
.sheet pre{white-space:pre-wrap;font-family:inherit;background:var(--chip);border-radius:12px;padding:12px;font-size:15px;margin:12px 0}
.sheet .actions{display:flex;gap:10px}
.sheet .actions button{flex:1;border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface);font-family:"Mitr",sans-serif}
.sheet .actions .primary{background:var(--cta);color:#fff;border-color:var(--cta)}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:25;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* =========================================================
   ตั้งค่าร้าน — แก้เฉพาะส่วนนี้
   ========================================================= */
const CONFIG = {
  LIFF_ID: "2012039672-zfDXVrM2",      // ใส่ LIFF ID จาก LINE Developers เช่น "2001234567-AbCdEfGh"
  SHOP_NAME: "Tod YEN Thai Tea",
  ITEM_NAME: "ชาไทย",
  PRICE: 40,                     // ราคาต่อแก้ว
  PROMO_PAIR: 75,                // ราคาโปร 2 แก้ว (ใส่ 0 ถ้าไม่มีโปร)
  PAY_KEYWORD: "ชำระเงิน",       // ต้องตรงกับคีย์เวิร์ดข้อความตอบกลับอัตโนมัติ
  OA_ID: "@137zxich"             // LINE ID ของร้าน (ขึ้นต้นด้วย @) ใช้ตอนเปิดหน้านี้นอก LINE
};
const SWEET = [
  { v: 0,   t: "ไม่หวาน" },
  { v: 25,  t: "หวานน้อย" },
  { v: 50,  t: "หวานครึ่ง" },
  { v: 100, t: "หวานปกติ" },
  { v: 125, t: "หวานมาก" }
];
/* ========================================================= */

const $ = (id) => document.getElementById(id);
const state = { sweet: 100, qty: 1, cart: new Map() };
let liffReady = false;

$("promoOld").textContent = CONFIG.PRICE * 2;
$("promoNew").textContent = CONFIG.PROMO_PAIR;
if (!CONFIG.PROMO_PAIR) document.querySelector(".promo").hidden = true;

function cupSVG(level, uid) {
  const top = 8, bottom = 48, h = bottom - top;
  const fillH = h * Math.min(level, 100) / 100;
  const dome = level > 100
    ? `<ellipse cx="20" cy="${top}" rx="13" ry="${3 + (level - 100) / 10}" class="sugar"/>` : "";
  return `<svg viewBox="0 0 40 52" aria-hidden="true">
    <defs><clipPath id="c${uid}"><path d="M6 ${top} L34 ${top} L30 ${bottom} L10 ${bottom} Z"/></clipPath></defs>
    <rect x="0" y="${bottom - fillH}" width="40" height="${fillH}" class="sugar" clip-path="url(#c${uid})"/>
    ${dome}
    <path d="M6 ${top} L34 ${top} L30 ${bottom} L10 ${bottom} Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M4 ${top} H36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
}

function sweetLabel(v) { return SWEET.find(s => s.v === v).t; }

function renderSweet() {
  $("sweet").innerHTML = SWEET.map((s, i) => `
    <button type="button" class="sw" role="radio" aria-checked="${s.v === state.sweet}" data-v="${s.v}" tabindex="${s.v === state.sweet ? 0 : -1}">
      ${cupSVG(s.v, "s" + i)}
      <span class="pct">${s.v}%</span>
      <span class="lbl">${s.t}</span>
    </button>`).join("");
}
$("sweet").addEventListener("click", e => {
  const b = e.target.closest(".sw"); if (!b) return;
  state.sweet = Number(b.dataset.v); renderSweet();
  $("sweet").querySelector(`[data-v="${state.sweet}"]`).focus();
});
$("sweet").addEventListener("keydown", e => {
  const idx = SWEET.findIndex(s => s.v === state.sweet);
  let n = idx;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") n = Math.min(SWEET.length - 1, idx + 1);
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") n = Math.max(0, idx - 1);
  else return;
  e.preventDefault(); state.sweet = SWEET[n].v; renderSweet();
  $("sweet").querySelector(`[data-v="${state.sweet}"]`).focus();
});

$("qMinus").onclick = () => { state.qty = Math.max(1, state.qty - 1); $("qOut").textContent = state.qty; };
$("qPlus").onclick  = () => { state.qty = Math.min(20, state.qty + 1); $("qOut").textContent = state.qty; };

$("addBtn").onclick = () => {
  const cur = state.cart.get(state.sweet) || 0;
  state.cart.set(state.sweet, cur + state.qty);
  toast(`เพิ่ม${CONFIG.ITEM_NAME} ${sweetLabel(state.sweet)} ${state.qty} แก้วแล้ว`);
  state.qty = 1; $("qOut").textContent = 1;
  renderCart(true);
};

function totals() {
  let n = 0; state.cart.forEach(q => n += q);
  const regular = n * CONFIG.PRICE;
  if (!CONFIG.PROMO_PAIR) return { n, regular, discount: 0, total: regular, pairs: 0 };
  const pairs = Math.floor(n / 2);
  const total = pairs * CONFIG.PROMO_PAIR + (n % 2) * CONFIG.PRICE;
  return { n, regular, discount: regular - total, total, pairs };
}

function cartLines() {
  return [...state.cart.entries()].filter(([, q]) => q > 0).sort((a, b) => a[0] - b[0]);
}

function renderCart(bump) {
  const lines = cartLines();
  if (!lines.length) {
    $("cart").innerHTML = `<p class="empty">เลือกความหวานด้านบน แล้วกด "เพิ่มลงตะกร้า"</p>`;
  } else {
    $("cart").innerHTML = lines.map(([v, q], i) => `
      <div class="line">
        <span class="mini">${cupSVG(v, "l" + i)}</span>
        <div class="name"><b>${CONFIG.ITEM_NAME}</b><span>${sweetLabel(v)} ${v}%</span></div>
        <div class="qty">
          <button type="button" data-act="dec" data-v="${v}" aria-label="ลด ${sweetLabel(v)}">−</button>
          <output>${q}</output>
          <button type="button" data-act="inc" data-v="${v}" aria-label="เพิ่ม ${sweetLabel(v)}">+</button>
        </div>
      </div>`).join("");
  }
  const t = totals();
  const sum = $("sum");
  if (t.n) {
    sum.hidden = false;
    sum.innerHTML = `
      <div><span>ราคาปกติ ${t.n} แก้ว × ${CONFIG.PRICE}</span><span>${t.regular} บาท</span></div>
      ${t.discount ? `<div class="disc"><span>ส่วนลดโปร 2 แก้ว (${t.pairs} คู่)</span><span>−${t.discount} บาท</span></div>` : ""}
      <div class="total"><span>ยอดที่ต้องชำระ</span><span>${t.total} บาท</span></div>`;
  } else sum.hidden = true;

  $("barCount").textContent = t.n ? `${t.n} แก้ว` : "ยังไม่มีรายการ";
  $("barTotal").textContent = `${t.total} บาท`;
  $("goBtn").disabled = !t.n;
  const up = $("upsell");
  if (CONFIG.PROMO_PAIR && t.n % 2 === 1) {
    up.hidden = false;
    up.textContent = `เพิ่มอีก 1 แก้ว จ่ายเพิ่มแค่ ${CONFIG.PROMO_PAIR - CONFIG.PRICE} บาท (โปร 2 แก้ว ${CONFIG.PROMO_PAIR})`;
  } else up.hidden = true;
  if (bump) { const el = $("barTotal"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
$("cart").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const v = Number(b.dataset.v), q = state.cart.get(v) || 0;
  const nq = b.dataset.act === "inc" ? q + 1 : q - 1;
  if (nq <= 0) state.cart.delete(v); else state.cart.set(v, nq);
  renderCart(true);
});

function orderId() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `TY${p(d.getHours())}${p(d.getMinutes())}${p(Math.floor(Math.random() * 100))}`;
}

function textSummary(id) {
  const t = totals();
  const note = $("note").value.trim();
  let s = `🧾 ออเดอร์ #${id}\n`;
  cartLines().forEach(([v, q]) => s += `• ${CONFIG.ITEM_NAME} ${sweetLabel(v)} (${v}%) × ${q}\n`);
  s += `\nรวม ${t.n} แก้ว ราคาปกติ ${t.regular} บาท\n`;
  if (t.discount) s += `ส่วนลดโปร 2 แก้ว −${t.discount} บาท\n`;
  s += `💰 ยอดชำระ ${t.total} บาท`;
  if (note) s += `\n📍 ที่อยู่จัดส่ง: ${note}`;
  s += `\n\nกด "${CONFIG.PAY_KEYWORD}" เพื่อรับ QR Code`;
  return s;
}

function flexSummary(id) {
  const t = totals();
  const note = $("note").value.trim();
  const row = (l, r, opt = {}) => ({
    type: "box", layout: "horizontal", margin: "sm", contents: [
      { type: "text", text: l, size: opt.size || "sm", color: opt.color || "#555555", flex: 5, wrap: true, weight: opt.weight || "regular" },
      { type: "text", text: r, size: opt.size || "sm", color: opt.rcolor || opt.color || "#111111", flex: 3, align: "end", weight: opt.weight || "regular" }
    ]
  });
  const items = cartLines().map(([v, q]) =>
    row(`${CONFIG.ITEM_NAME} ${sweetLabel(v)} ${v}% × ${q}`, `${q * CONFIG.PRICE} บาท`));
  const body = [
    ...items,
    { type: "separator", margin: "md" },
    ...(t.discount ? [row(`ส่วนลดโปร 2 แก้ว`, `−${t.discount} บาท`, { color: "#E05638" })] : []),
    row("ยอดชำระ", `${t.total} บาท`, { size: "md", weight: "bold", color: "#111111", rcolor: "#E2701F" })
  ];
  if (note) body.push({ type: "text", text: `ที่อยู่จัดส่ง: ${note}`, size: "xs", color: "#888888", wrap: true, margin: "md" });
  return {
    type: "flex",
    altText: `ออเดอร์ #${id} ยอดชำระ ${t.total} บาท`,
    contents: {
      type: "bubble",
      header: { type: "box", layout: "vertical", backgroundColor: "#0B4AA8", paddingAll: "16px", contents: [
        { type: "text", text: CONFIG.SHOP_NAME, color: "#FFD23F", size: "sm", weight: "bold" },
        { type: "text", text: `รายการสั่งซื้อ #${id}`, color: "#FFFFFF", size: "lg", weight: "bold", margin: "sm" },
        { type: "text", text: `${t.n} แก้ว`, color: "#BFD1F2", size: "xs" }
      ]},
      body: { type: "box", layout: "vertical", contents: body },
      footer: { type: "box", layout: "vertical", contents: [
        { type: "button", style: "primary", color: "#FF8200", height: "sm",
          action: { type: "message", label: "ชำระเงิน", text: CONFIG.PAY_KEYWORD } }
      ]}
    }
  };
}

function openSheet(title, msg, text) {
  $("sheetTitle").textContent = title;
  $("sheetMsg").textContent = msg;
  $("sheetText").textContent = text;
  $("overlay").classList.add("open");
  $("copyBtn").focus();
}
$("closeSheet").onclick = () => $("overlay").classList.remove("open");
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") $("overlay").classList.remove("open"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("overlay").classList.remove("open"); });
$("copyBtn").onclick = async () => {
  const txt = $("sheetText").textContent;
  if (CONFIG.OA_ID && !CONFIG.OA_ID.startsWith("@yourshop")) {
    location.href = `https://line.me/R/oaMessage/${encodeURIComponent(CONFIG.OA_ID)}/?${encodeURIComponent(txt)}`;
    return;
  }
  try { await navigator.clipboard.writeText(txt); }
  catch { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast("คัดลอกแล้ว นำไปวางในแชทของร้านได้เลย");
};

$("goBtn").onclick = async () => {
  if (!totals().n) return;
  const id = orderId();
  const text = textSummary(id);
  if (liffReady && liff.isInClient()) {
    const btn = $("goBtn"); btn.disabled = true; btn.textContent = "กำลังส่ง…";
    try {
      await liff.sendMessages([flexSummary(id)]);
      toast("ส่งออเดอร์เข้าแชทแล้ว");
      setTimeout(() => liff.closeWindow(), 900);
      return;
    } catch (err) {
      try { await liff.sendMessages([{ type: "text", text }]); setTimeout(() => liff.closeWindow(), 900); return; }
      catch (err2) {
        openSheet("ส่งเข้าแชทไม่สำเร็จ", "กด สั่งซื้อ เพื่อลองส่งอีกครั้ง", text);
      }
    } finally { btn.disabled = false; btn.textContent = "ยืนยันคำสั่งซื้อ"; }
  } else {
    openSheet("สรุปคำสั่งซื้อ", "ตรวจสอบรายการ แล้วกด สั่งซื้อ เพื่อส่งเข้าแชทของร้าน", text);
  }
};

let toastTimer;
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

renderSweet();
renderCart(false);

(async () => {
  if (typeof liff === "undefined" || CONFIG.LIFF_ID.startsWith("YOUR")) return; // โหมดทดลอง
  try { await liff.init({ liffId: CONFIG.LIFF_ID }); liffReady = true; }
  catch (e) { console.warn("LIFF init failed", e); }
})();
</script>
</body>
</html>
